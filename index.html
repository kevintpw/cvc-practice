<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVC 發音練習排程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scale-in {
            animation: scaleIn 0.2s ease-out forwards;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(35deg); }
            50% { transform: rotate(-35deg); }
        }
        @keyframes metronome-blink {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            10%, 40% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 15px rgba(245, 158, 11, 0.8); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const INITIALS_DATA = [
          { symbol: 'ㄅ', letters: 'b', tags: ['8800音', '140音'] },
          { symbol: 'ㄆ', letters: 'p', tags: ['8800音', '140音'] },
          { symbol: 'ㄇ', letters: 'm', tags: ['8800音', '140音'] },
          { symbol: 'ㄈ', letters: 'f', tags: ['8800音', '140音'] },
          { symbol: 'ㄉ(ㄗ)', letters: 'd', tags: ['8800音', '140音'] },
          { symbol: 'ㄊ(ㄘ)', letters: 't', tags: ['8800音', '140音'] },
          { symbol: 'ㄋ', letters: 'n', tags: ['8800音', '140音'] },
          { symbol: '(黏舌ㄌ)', letters: 'l', tags: ['8800音', '140音'] },
          { symbol: 'ㄍ', letters: 'g', tags: ['8800音', '140音'] },
          { symbol: 'ㄎ', letters: 'k', tags: ['8800音', '140音'] },
          { symbol: 'ㄏ', letters: 'h', tags: ['8800音', '140音'] },
          { symbol: 'ㄙ', letters: 's', tags: ['8800音', '140音'] },
          { symbol: 'ㄙ(θ)', letters: 'th', tags: ['8800音', '140音'] },
          { symbol: 'ㄖㄨ', letters: 'r', tags: ['8800音', '140音'] },
          { symbol: 'ㄓㄨ', letters: 'dr', tags: ['8800音', '280音'] },
          { symbol: 'ㄔㄨ', letters: 'tr', tags: ['8800音', '280音'] },
          { symbol: 'ㄙㄅ', letters: 'sp', tags: ['8800音', '280音'] },
          { symbol: 'ㄙㄉ(ㄗ)', letters: 'st', tags: ['8800音', '280音'] },
          { symbol: 'ㄙㄍ', letters: 'sk', tags: ['8800音', '280音'] },
          { symbol: 'ㄙㄓㄨ', letters: 'str', tags: ['8800音', '280音'] },
          { symbol: 'Z(θ)', letters: 'th', tags: ['140音'] },
          { symbol: 'ㄅㄖㄨ', letters: 'br', tags: ['280音'] },
          { symbol: 'ㄆㄖㄨ', letters: 'pr', tags: ['280音'] },
          { symbol: 'ㄅ(黏舌ㄌ)', letters: 'bl', tags: ['280音'] },
          { symbol: 'ㄆ(黏舌ㄌ)', letters: 'pl', tags: ['280音'] },
          { symbol: 'ㄎ(黏舌ㄌ)', letters: 'cl', tags: ['280音'] },
          { symbol: 'ㄙ(黏舌ㄌ)', letters: 'sl', tags: ['280音'] },
          { symbol: 'ㄙㄇ', letters: 'sm', tags: ['280音'] },
          { symbol: 'ㄙㄋ', letters: 'sn', tags: ['280音'] },
          { symbol: 'ㄈㄖㄨ', letters: 'fr', tags: ['加練'] },
          { symbol: 'ㄍㄖㄨ', letters: 'gr', tags: ['加練'] },
          { symbol: 'ㄎㄖㄨ', letters: 'cr', tags: ['加練'] },
          { symbol: 'ㄙ(θ)ㄖㄨ', letters: 'thr', tags: ['加練'] },
          { symbol: 'ㄈ(黏舌ㄌ)', letters: 'fl', tags: ['加練'] },
          { symbol: 'ㄍ(黏舌ㄌ)', letters: 'gl', tags: ['加練'] },
          { symbol: 'ㄙㄅㄖㄨ', letters: 'spr', tags: ['加練'] },
          { symbol: 'ㄙㄅ(黏舌ㄌ)', letters: 'spl', tags: ['加練'] }
        ];

        const VOWELS_DATA = [
          { symbol: 'ㄝ', letters: 'e', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄝㄧ', letters: 'a_e, ai', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄝㄚ', letters: 'a', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄝㄠ', letters: 'ou', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄜ', letters: 'u', tags: ['8800音'] },
          { symbol: 'ㄧㄜ', letters: 'i', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄨㄜ', letters: 'oo', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄜㄨ', letters: 'o_e', tags: ['10大母音', '8800音'] },
          { symbol: '(喉後ㄚ)', letters: 'o', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄦ', letters: 'er, ir, ur', tags: ['10大母音', '8800音'] },
          { symbol: '(喉後ㄚ)ㄦ', letters: 'ar', tags: ['10大母音', '8800音'] },
          { symbol: 'ㄝㄦ', letters: 'air', tags: ['8800音'] },
          { symbol: 'ㄛㄦ', letters: 'or', tags: ['8800音'] },
          { symbol: 'ㄧㄨ', letters: 'u_e', tags: ['8800音'] },
          { symbol: 'ㄛㄧ', letters: 'oi', tags: ['8800音'] },
          { symbol: '(微笑ㄧ)', letters: 'e_e, ee', tags: ['8800音'] },
          { symbol: 'ㄞ', letters: 'i_e', tags: ['8800音'] }
        ];

        const TAILS_DATA = [
          { symbol: 'ㄙ', letters: 's', tags: [] },
          { symbol: 'ㄙ', letters: 'ss', tags: [] },
          { symbol: 'ㄅ"', letters: 'b', tags: [] },
          { symbol: 'ㄆ"', letters: 'p', tags: ['快拍'] },
          { symbol: 'ㄉ"', letters: 'd', tags: [] },
          { symbol: 'ㄊ"', letters: 't', tags: ['快拍'] },
          { symbol: 'ㄍ"', letters: 'g', tags: [] },
          { symbol: 'ㄎ"', letters: 'ck', tags: ['快拍'] },
          { symbol: 'ㄙㄊ"', letters: 'st', tags: ['快拍'] },
          { symbol: 'ㄙㄆ"', letters: 'sp', tags: ['快拍'] },
          { symbol: 'ㄇ(~)', letters: 'm', tags: [] },
          { symbol: 'ㄇ(~)ㄅ"', letters: 'mb', tags: [] },
          { symbol: 'ㄇ(~)ㄆ"', letters: 'mp', tags: ['快拍'] },
          { symbol: 'ㄋ(~)', letters: 'n', tags: [] },
          { symbol: 'ㄋ(~)ㄉ"', letters: 'nd', tags: [] },
          { symbol: 'ㄋ(~)ㄊ"', letters: 'nt', tags: ['快拍'] },
          { symbol: 'ㄈ(f)', letters: 'ph', tags: [] },
          { symbol: 'ㄑㄩ', letters: 'ch', tags: [] },
          { symbol: 'ㄒㄩ', letters: 'sh', tags: [] },
          { symbol: 'ㄙ(θ)', letters: 'th', tags: [] }
        ];

        const INITIAL_GROUPS = ['8800音', '140音', '280音', '加練'];
        const VOWEL_GROUPS = ['10大母音', '8800音'];

        const getTodayLocalString = () => {
          const d = new Date();
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        function App() {
          const loadData = (key, defaultValue) => {
            try {
              const saved = localStorage.getItem(key);
              return saved ? JSON.parse(saved) : defaultValue;
            } catch (e) { return defaultValue; }
          };

          const [draftInitialFilters, setDraftInitialFilters] = useState(() => loadData('cvc_draftInitialFilters', ['8800音']));
          const [draftVowelFilters, setDraftVowelFilters] = useState(() => loadData('cvc_draftVowelFilters', ['8800音']));
          const [draftItemsPerDay, setDraftItemsPerDay] = useState(() => loadData('cvc_draftItemsPerDay', 10));
          const [draftPlanMode, setDraftPlanMode] = useState(() => loadData('cvc_draftPlanMode', 'itemsPerDay'));
          const [draftTargetDays, setDraftTargetDays] = useState(() => loadData('cvc_draftTargetDays', 30));
          const [draftStartDate, setDraftStartDate] = useState(() => loadData('cvc_draftStartDate', getTodayLocalString()));

          const [activePlan, setActivePlan] = useState(() => loadData('cvc_activePlan', {
            initialFilters: ['8800音'],
            vowelFilters: ['8800音'],
            itemsPerDay: 10,
            startDate: getTodayLocalString()
          }));

          const [currentDay, setCurrentDay] = useState(() => loadData('cvc_currentDay', 1));
          const [activeTab, setActiveTab] = useState('today'); 
          const [toastMessage, setToastMessage] = useState('');
          const [completedItems, setCompletedItems] = useState(() => loadData('cvc_progress', {}));
          const [starredItems, setStarredItems] = useState(() => loadData('cvc_starredItems', {}));
          
          const [bpm, setBpm] = useState(() => loadData('cvc_bpm', 60));
          const [metronomeType, setMetronomeType] = useState(() => loadData('cvc_metronomeType', 'pendulum'));
          const [isMetronomePlaying, setIsMetronomePlaying] = useState(false);

          const [showConfirmModal, setShowConfirmModal] = useState(false);
          const [randomCombo, setRandomCombo] = useState(null);
          const fileInputRef = useRef(null);

          useEffect(() => {
            localStorage.setItem('cvc_draftInitialFilters', JSON.stringify(draftInitialFilters));
            localStorage.setItem('cvc_draftVowelFilters', JSON.stringify(draftVowelFilters));
            localStorage.setItem('cvc_draftItemsPerDay', JSON.stringify(draftItemsPerDay));
            localStorage.setItem('cvc_draftPlanMode', JSON.stringify(draftPlanMode));
            localStorage.setItem('cvc_draftTargetDays', JSON.stringify(draftTargetDays));
            localStorage.setItem('cvc_draftStartDate', JSON.stringify(draftStartDate));
            localStorage.setItem('cvc_activePlan', JSON.stringify(activePlan));
            localStorage.setItem('cvc_currentDay', JSON.stringify(currentDay));
            localStorage.setItem('cvc_progress', JSON.stringify(completedItems));
            localStorage.setItem('cvc_starredItems', JSON.stringify(starredItems));
            localStorage.setItem('cvc_bpm', JSON.stringify(bpm));
            localStorage.setItem('cvc_metronomeType', JSON.stringify(metronomeType));
          }, [draftInitialFilters, draftVowelFilters, draftItemsPerDay, draftPlanMode, draftTargetDays, draftStartDate, activePlan, currentDay, completedItems, starredItems, bpm, metronomeType]);

          const toggleComplete = (comboId) => {
            const newCompleted = { ...completedItems, [comboId]: !completedItems[comboId] };
            setCompletedItems(newCompleted);
          };

          const toggleStar = (e, comboId) => {
            e.stopPropagation();
            const newStarred = { ...starredItems };
            if (newStarred[comboId]) {
              delete newStarred[comboId];
            } else {
              newStarred[comboId] = true;
            }
            setStarredItems(newStarred);
          };

          const filteredInitials = useMemo(() => {
            if (activePlan.initialFilters.length === 0) return [];
            return INITIALS_DATA.filter(initial => initial.tags.some(tag => activePlan.initialFilters.includes(tag)));
          }, [activePlan.initialFilters]);

          const filteredVowels = useMemo(() => {
            if (activePlan.vowelFilters.length === 0) return [];
            return VOWELS_DATA.filter(vowel => vowel.tags.some(tag => activePlan.vowelFilters.includes(tag)));
          }, [activePlan.vowelFilters]);

          const combinations = useMemo(() => {
            const results = [];
            filteredInitials.forEach(initial => {
              filteredVowels.forEach(vowel => { results.push({ initial, vowel }); });
            });
            return results;
          }, [filteredInitials, filteredVowels]);

          const totalDays = Math.ceil(combinations.length / activePlan.itemsPerDay) || 1;

          const actualTodayNum = useMemo(() => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const start = new Date(activePlan.startDate);
            start.setHours(0, 0, 0, 0);
            const diffTime = today.getTime() - start.getTime();
            // 改用 Math.round 避免日光節約時間造成的誤差
            return Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
          }, [activePlan.startDate]);

          const jumpToToday = () => {
            // v1.18 修改：直接跳轉到真實的「今天」天數，不限制在 1 ~ totalDays 內
            setCurrentDay(actualTodayNum);
          };

          useEffect(() => {
            jumpToToday();
          }, [activePlan.startDate, totalDays]);

          const generateRandomCombo = () => {
            if (combinations.length > 0) {
              const randomIndex = Math.floor(Math.random() * combinations.length);
              setRandomCombo(combinations[randomIndex]);
            } else {
              setRandomCombo(null);
            }
          };

          useEffect(() => {
            if (!randomCombo && combinations.length > 0) {
              generateRandomCombo();
            }
          }, [combinations, randomCombo]);

          const completedCount = useMemo(() => {
            return combinations.filter(item => {
              const comboId = `${item.initial.symbol}-${item.vowel.symbol}`;
              return !!completedItems[comboId];
            }).length;
          }, [combinations, completedItems]);

          const progressPercentage = combinations.length > 0 ? Math.round((completedCount / combinations.length) * 100) : 0;

          const weaknessItems = useMemo(() => {
            return combinations.filter(item => {
              const comboId = `${item.initial.symbol}-${item.vowel.symbol}`;
              return !!starredItems[comboId];
            });
          }, [combinations, starredItems]);

          // v1.18 修改：移除自動重置為 1 的邏輯，允許 currentDay 超出範圍以顯示尚未開始或已結束

          const todayItems = useMemo(() => {
            // v1.18 修改：如果今天不在計畫天數範圍內，回傳空陣列
            if (currentDay < 1 || currentDay > totalDays) return [];
            const start = (currentDay - 1) * activePlan.itemsPerDay;
            return combinations.slice(start, start + activePlan.itemsPerDay);
          }, [combinations, currentDay, activePlan.itemsPerDay, totalDays]);

          const handleInitialFilterChange = (group) => {
            setDraftInitialFilters(prev => prev.includes(group) ? prev.filter(g => g !== group) : [...prev, group]);
          };

          const handleVowelFilterChange = (group) => {
            setDraftVowelFilters(prev => prev.includes(group) ? prev.filter(g => g !== group) : [...prev, group]);
          };

          const calculateDate = (dayOffset) => {
            const date = new Date(activePlan.startDate);
            date.setDate(date.getDate() + (dayOffset - 1));
            return date.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', weekday: 'short' });
          };

          const draftCombinationsLength = useMemo(() => {
            const initials = INITIALS_DATA.filter(i => i.tags.some(tag => draftInitialFilters.includes(tag)));
            const vowels = VOWELS_DATA.filter(v => v.tags.some(tag => draftVowelFilters.includes(tag)));
            return initials.length * vowels.length;
          }, [draftInitialFilters, draftVowelFilters]);

          const derivedItemsPerDay = useMemo(() => {
            if (draftPlanMode === 'targetDays') {
              return draftTargetDays > 0 ? Math.ceil(draftCombinationsLength / draftTargetDays) : 1;
            }
            return draftItemsPerDay;
          }, [draftPlanMode, draftTargetDays, draftCombinationsLength, draftItemsPerDay]);

          const derivedTotalDays = useMemo(() => {
            if (draftPlanMode === 'itemsPerDay') {
              return derivedItemsPerDay > 0 ? Math.ceil(draftCombinationsLength / derivedItemsPerDay) : 1;
            }
            return draftTargetDays;
          }, [draftPlanMode, draftItemsPerDay, draftCombinationsLength, draftTargetDays, derivedItemsPerDay]);

          const handleCreatePlan = () => {
            setActivePlan({
              initialFilters: draftInitialFilters,
              vowelFilters: draftVowelFilters,
              itemsPerDay: derivedItemsPerDay || 1,
              startDate: draftStartDate
            });
            setCompletedItems({});
            setCurrentDay(1);
            setRandomCombo(null);
            setShowConfirmModal(false);
            setToastMessage('新練習計劃已建立！');
            setTimeout(() => setToastMessage(''), 3000);
          };

          const downloadFile = (content, filename, mimeType) => {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const handleExportCSV = () => {
            const headers = ['第幾天', '日期', '完成', '音標組合', '字母組合'];
            const rows = combinations.map((item, index) => {
              const dayNum = Math.floor(index / activePlan.itemsPerDay) + 1;
              const isFirstOfNewDay = index % activePlan.itemsPerDay === 0;
              const dateStr = isFirstOfNewDay ? calculateDate(dayNum) : '';
              const dayStr = isFirstOfNewDay ? `Day ${dayNum}` : '';
              const symbolCombo = `${item.initial.symbol}${item.vowel.symbol}`;
              const comboId = `${item.initial.symbol}-${item.vowel.symbol}`;
              const isCompleted = completedItems[comboId] ? 'V' : '';
              const letterCombo = `${item.initial.letters} / ${item.vowel.letters}`.replace(/"/g, '""');
              return `"${dayStr}", "${dateStr}", "${isCompleted}", "${symbolCombo}", "${letterCombo}"`;
            });
            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            downloadFile(csvContent, 'CVC_發音練習排程.csv', 'text/csv;charset=utf-8;');
            setToastMessage('試算表已匯出！');
            setTimeout(() => setToastMessage(''), 3000);
          };

          // 核心修復：完整無缺的行事曆匯出邏輯
          const handleExportCalendar = () => {
            try {
              let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CVC Pronunciation App//TW\r\nCALSCALE:GREGORIAN\r\n";
              
              const daysData = [];
              combinations.forEach((item, index) => {
                const dayIndex = Math.floor(index / activePlan.itemsPerDay);
                if (!daysData[dayIndex]) daysData[dayIndex] = [];
                daysData[dayIndex].push(item);
              });

              const now = new Date();
              const dtStamp = now.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

              // 將每一天的練習項目轉換為一個 VEVENT 事件
              daysData.forEach((dayItems, dayIndex) => {
                const current = new Date(activePlan.startDate);
                current.setDate(current.getDate() + dayIndex);
                const next = new Date(current);
                next.setDate(next.getDate() + 1);

                const formatIcsDate = (d) => {
                  if (isNaN(d.getTime())) return "";
                  const yyyy = d.getFullYear();
                  const mm = String(d.getMonth() + 1).padStart(2, '0');
                  const dd = String(d.getDate()).padStart(2, '0');
                  return `${yyyy}${mm}${dd}`;
                };

                let description = "⭐ 今日 CVC 發音練習項目：\\n\\n";
                dayItems.forEach(item => {
                  description += `➤ ${item.initial.symbol}${item.vowel.symbol} (${item.initial.letters} / ${item.vowel.letters})\\n`;
                });
                description += "\\n請開啟「CVC 發音練習排程」網頁進行打卡！";

                icsContent += "BEGIN:VEVENT\r\n";
                icsContent += `UID:cvc-day-${dayIndex + 1}-${dtStamp}@cvc-app\r\n`;
                icsContent += `DTSTAMP:${dtStamp}\r\n`;
                icsContent += `DTSTART;VALUE=DATE:${formatIcsDate(current)}\r\n`;
                icsContent += `DTEND;VALUE=DATE:${formatIcsDate(next)}\r\n`;
                icsContent += `SUMMARY:CVC 發音練習 - Day ${dayIndex + 1}\r\n`;
                icsContent += `DESCRIPTION:${description}\r\n`;
                icsContent += "END:VEVENT\r\n";
              });

              icsContent += "END:VCALENDAR\r\n";
              
              // 檔名自動加入時間戳記
              const yyyy = now.getFullYear();
              const mm = String(now.getMonth() + 1).padStart(2, '0');
              const dd = String(now.getDate()).padStart(2, '0');
              const hh = String(now.getHours()).padStart(2, '0');
              const min = String(now.getMinutes()).padStart(2, '0');
              const ss = String(now.getSeconds()).padStart(2, '0');
              const timestamp = `${yyyy}${mm}${dd}_${hh}${min}${ss}`;
              
              downloadFile(icsContent, `CVC_發音練習日曆_${timestamp}.ics`, 'text/calendar;charset=utf-8');
              setToastMessage('日曆檔已匯出！請至 Google 日曆「匯入」此檔案。');
              setTimeout(() => setToastMessage(''), 5000);
            } catch (error) {
              console.error("ICS Export Error:", error);
              setToastMessage('產生日曆檔失敗，請確認開始日期格式是否正確。');
              setTimeout(() => setToastMessage(''), 3000);
            }
          };

          const handleExportProgress = () => {
            const exportData = {
              completedItems: completedItems,
              starredItems: starredItems
            };
            const dataStr = JSON.stringify(exportData);
            
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const timestamp = `${yyyy}${mm}${dd}_${hh}${min}${ss}`;
            
            const filename = `CVC_進度備份_${timestamp}.json`;

            downloadFile(dataStr, filename, 'application/json;charset=utf-8;');
            setToastMessage('進度與收藏已匯出備份！');
            setTimeout(() => setToastMessage(''), 3000);
          };

          const handleImportProgress = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const fileReader = new FileReader();
            fileReader.readAsText(file, "UTF-8");
            fileReader.onload = e => {
              try {
                const importedData = JSON.parse(e.target.result);
                if (typeof importedData === 'object') {
                  if (importedData.completedItems !== undefined || importedData.starredItems !== undefined) {
                    if (importedData.completedItems) setCompletedItems(importedData.completedItems);
                    if (importedData.starredItems) setStarredItems(importedData.starredItems);
                  } else {
                    setCompletedItems(importedData);
                  }
                  setToastMessage('進度與收藏已成功匯入！');
                }
              } catch (error) { setToastMessage('檔案格式錯誤，匯入失敗。'); }
              setTimeout(() => setToastMessage(''), 3000);
            };
            event.target.value = null;
          };

          return (
            <div className="p-4 md:p-8">
              <div className="max-w-6xl mx-auto space-y-6">
                
                <header className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <div>
                    <h1 className="text-2xl font-bold text-slate-800 tracking-wide flex items-center gap-2">
                      CVC 發音練習排程
                      <span className="text-sm text-slate-500 font-bold bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-lg tracking-normal">v1.18</span>
                    </h1>
                    <p className="text-slate-500 text-sm mt-1">規劃專屬的 CVC 發音練習計畫</p>
                  </div>
                </header>

                <div className="flex flex-col sm:flex-row justify-between items-end sm:items-center gap-4 mt-4">
                  <div className="flex bg-slate-200/50 p-1 rounded-xl flex-wrap">
                    <button onClick={() => setActiveTab('today')} className={`px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'today' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>今日練習項目</button>
                    <button onClick={() => setActiveTab('preview')} className={`px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'preview' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>完整時程預覽</button>
                    <button onClick={() => { setActiveTab('random'); if(!randomCombo) generateRandomCombo(); }} className={`px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'random' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>隨機練習</button>
                    <button onClick={() => setActiveTab('weakness')} className={`px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'weakness' ? 'bg-white text-amber-700 shadow-sm border-amber-200' : 'text-slate-500 hover:text-slate-700'}`}>弱點特訓 ⭐</button>
                    <button onClick={() => setActiveTab('cvlist')} className={`px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'cvlist' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>CVC列表</button>
                    <button onClick={() => setActiveTab('settings')} className={`px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'settings' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>設定與備份 ⚙️</button>
                  </div>
                  
                  <div className="flex flex-wrap items-center gap-3 sm:gap-4 bg-white px-4 py-2 rounded-xl border border-slate-100 shadow-sm">
                    <div className="text-sm font-medium text-slate-600">總組合數：<span className="text-slate-900 font-bold">{combinations.length}</span></div>
                    <div className="w-px h-4 bg-slate-200 hidden sm:block"></div>
                    <div className="text-sm font-medium text-slate-600">預計天數：<span className="text-slate-900 font-bold">{totalDays}</span> 天</div>
                    <div className="w-px h-4 bg-slate-200 hidden sm:block"></div>
                    <div className="text-sm font-medium text-slate-600">目前進度：<span className="text-green-600 font-bold">{completedCount}</span> <span className="text-slate-400 font-normal">/ {combinations.length} ({progressPercentage}%)</span></div>
                  </div>
                </div>

                {activeTab !== 'settings' && activeTab !== 'cvlist' && (
                  <div className="flex flex-wrap items-center gap-4 bg-white px-4 sm:px-6 py-3 rounded-2xl border border-slate-100 shadow-sm mt-4 animate-fade-in">
                    <div className="flex items-center gap-2 text-slate-700 font-bold">
                      <svg className="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      視覺化節拍器
                    </div>
                    <div className="w-px h-6 bg-slate-200 hidden sm:block"></div>
                    <div className="flex items-center gap-1 bg-slate-50 p-1 rounded-lg border border-slate-100">
                      <button onClick={() => setBpm(b => Math.max(20, b - 2))} className="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm hover:bg-slate-100 text-slate-600 font-bold">-</button>
                      <span className="font-bold w-16 text-center text-slate-800">{bpm} BPM</span>
                      <button onClick={() => setBpm(b => Math.min(240, b + 2))} className="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm hover:bg-slate-100 text-slate-600 font-bold">+</button>
                    </div>
                    <select value={metronomeType} onChange={(e) => setMetronomeType(e.target.value)} className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-700">
                      <option value="pendulum">鐘擺</option>
                      <option value="dot">光點閃爍</option>
                    </select>
                    <button onClick={() => setIsMetronomePlaying(!isMetronomePlaying)} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition-colors ${isMetronomePlaying ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'}`}>
                      {isMetronomePlaying ? '暫停' : '播放'}
                    </button>
                    
                    <div className="ml-auto w-16 h-12 flex justify-center items-end pb-1 border-l pl-4 border-slate-100 overflow-hidden">
                      {metronomeType === 'pendulum' ? (
                        <div className="w-1.5 h-10 bg-slate-300 rounded-full origin-bottom relative" style={{ animation: isMetronomePlaying ? `swing ${120/bpm}s infinite ease-in-out` : 'none', transform: isMetronomePlaying ? 'none' : 'rotate(0deg)' }}>
                          <div className="w-4 h-4 bg-indigo-500 rounded-full absolute -left-[5px] top-1 shadow-md"></div>
                        </div>
                      ) : (
                        <div className="flex items-center justify-center h-full w-full">
                          <div className="w-4 h-4 bg-amber-400 rounded-full" style={{ animation: isMetronomePlaying ? `metronome-blink ${60/bpm}s infinite` : 'none', opacity: isMetronomePlaying ? 1 : 0.2 }}></div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {combinations.length === 0 && activeTab !== 'settings' ? (
                  <div className="bg-white p-12 rounded-2xl text-center border border-slate-100 shadow-sm">
                    <p className="text-slate-400 text-lg mb-4">尚未產生任何組合，請前往「設定與備份」建立您的練習計畫。</p>
                    <button onClick={() => setActiveTab('settings')} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition-colors">前往設定</button>
                  </div>
                ) : (
                  <>
                    {/* 分頁一：今日練習項目 */}
                    {activeTab === 'today' && (
                      <div className="space-y-6">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-indigo-50 border border-indigo-100 p-4 rounded-xl gap-4">
                          <div className="flex flex-wrap items-center gap-3 sm:gap-4">
                            <label className="text-sm font-bold text-indigo-900">目前天數</label>
                            <select value={currentDay} onChange={(e) => setCurrentDay(Number(e.target.value))} className="px-3 py-1.5 bg-white border border-indigo-200 rounded-lg text-sm font-bold text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                              {currentDay < 1 && <option value={currentDay}>尚未開始</option>}
                              {Array.from({ length: totalDays }, (_, i) => i + 1).map(day => (<option key={day} value={day}>Day {day}</option>))}
                              {currentDay > totalDays && <option value={currentDay}>已結束</option>}
                            </select>
                            <button 
                              onClick={jumpToToday}
                              className="flex items-center gap-1.5 bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-700 hover:shadow-md transition-all active:scale-95"
                            >
                              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                              跳至今日
                            </button>
                          </div>
                          <div className="text-indigo-800 font-medium flex items-center gap-2">
                            <svg className="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            練習日期：{calculateDate(currentDay)}
                          </div>
                        </div>

                        {todayItems.length > 0 ? (
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
                            {todayItems.map((item, index) => {
                              const comboId = `${item.initial.symbol}-${item.vowel.symbol}`;
                              const isStarred = !!starredItems[comboId];
                              const isCompleted = !!completedItems[comboId];
                              return (
                                <div key={index} className={`bg-white px-2 py-5 sm:px-4 sm:py-6 rounded-2xl shadow-sm border flex flex-col items-center justify-center gap-2 transition-transform hover:-translate-y-1 hover:shadow-md relative group overflow-hidden ${isCompleted ? 'border-green-400 bg-green-50' : 'border-slate-100'}`}>
                                  
                                  <button onClick={() => toggleComplete(comboId)} className={`absolute top-2 left-2 sm:top-3 sm:left-3 p-1 rounded-full transition-colors focus:outline-none flex items-center justify-center border-2 w-6 h-6 sm:w-7 sm:h-7 ${isCompleted ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 hover:border-green-400 text-transparent'}`} title={isCompleted ? "取消完成" : "標記為完成"}>
                                    <svg className="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                  </button>

                                  <button onClick={(e) => toggleStar(e, comboId)} className="absolute top-2 right-2 sm:top-3 sm:right-3 p-1 rounded-full transition-colors hover:bg-slate-50 focus:outline-none" title="標記為困難音">
                                    <svg className={`w-5 h-5 sm:w-6 sm:h-6 transition-colors ${isStarred ? 'text-yellow-400 fill-yellow-400' : 'text-slate-300 group-hover:text-yellow-200'}`} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={isStarred ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                  </button>
                                  
                                  <div className="flex items-center justify-center whitespace-nowrap w-full text-lg sm:text-xl lg:text-2xl xl:text-lg 2xl:text-xl font-bold tracking-tight mt-2 sm:mt-3">
                                    <span className="text-blue-600">{item.initial.symbol}</span>
                                    <span className="text-red-600">{item.vowel.symbol}</span>
                                  </div>
                                  <div className="h-px w-10 sm:w-12 bg-slate-100 my-0.5 sm:my-1"></div>
                                  <div className="flex items-center justify-center whitespace-nowrap w-full text-xs sm:text-sm font-medium tracking-wider">
                                    <span className="text-blue-600">{item.initial.letters}</span>
                                    <span className="text-slate-300 mx-1.5 sm:mx-2"> </span>
                                    <span className="text-red-600">{item.vowel.letters}</span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        ) : (
                          <div className="bg-white p-8 sm:p-12 rounded-2xl text-center border border-slate-100 shadow-sm flex flex-col items-center justify-center mt-4">
                            <svg className="w-16 h-16 text-slate-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <p className="text-slate-500 text-lg font-bold">
                              {currentDay < 1 ? "練習計畫尚未開始，今天沒有任務喔！" : "計畫已結束，太棒了！所有的發音都練完了！"}
                            </p>
                            <p className="text-slate-400 mt-2 text-sm">您可以從上方下拉選單切換天數進行複習，或前往「設定與備份」建立新計畫。</p>
                          </div>
                        )}
                      </div>
                    )}

                    {/* 分頁二：完整時程預覽 */}
                    {activeTab === 'preview' && (
                      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-4 bg-slate-50 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                          <h3 className="font-bold text-slate-700 flex items-center gap-2">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                            全排程預覽清單
                          </h3>
                          <div className="flex gap-2">
                            <button onClick={handleExportCalendar} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg hover:bg-blue-700 transition-colors">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                              匯出日曆 (.ics)
                            </button>
                            <button onClick={handleExportCSV} className="flex items-center gap-2 px-4 py-2 bg-slate-800 text-white text-sm font-bold rounded-lg hover:bg-slate-700 transition-colors">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                              匯出試算表
                            </button>
                          </div>
                        </div>

                        <div className="px-6 py-5 bg-white border-b border-slate-100">
                          <div className="flex justify-between items-end mb-2">
                            <span className="text-sm font-bold text-slate-700">整體完成度</span>
                            <span className="text-sm font-bold text-green-600">{progressPercentage}% <span className="text-slate-400 font-medium text-xs ml-1">({completedCount} / {combinations.length} 組)</span></span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                            <div className="bg-green-500 h-2.5 rounded-full transition-all duration-700 ease-out" style={{ width: `${progressPercentage}%` }}></div>
                          </div>
                        </div>
                        
                        <div className="p-4 sm:p-6 bg-slate-50/50 max-h-[600px] overflow-y-auto">
                          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6">
                            {Array.from({ length: totalDays }).map((_, i) => {
                              const dayNum = i + 1;
                              const start = i * activePlan.itemsPerDay;
                              const dayItems = combinations.slice(start, start + activePlan.itemsPerDay);
                              
                              if (dayItems.length === 0) return null;

                              const dayCompletedCount = dayItems.filter(item => completedItems[`${item.initial.symbol}-${item.vowel.symbol}`]).length;
                              const isAllDone = dayCompletedCount > 0 && dayCompletedCount === dayItems.length;
                              const isToday = dayNum === actualTodayNum;

                              return (
                                <div key={dayNum} className={`bg-white rounded-2xl border-2 ${isToday ? 'border-blue-400 shadow-md shadow-blue-100 ring-2 ring-blue-100' : isAllDone ? 'border-green-300 shadow-sm shadow-green-100' : 'border-slate-200'} p-4 flex flex-col gap-3 transition-all relative overflow-hidden`}>
                                  
                                  {isToday && (
                                    <div className="absolute top-0 left-0 w-full h-1.5 bg-blue-500"></div>
                                  )}

                                  <div className="flex justify-between items-start sm:items-center border-b border-slate-100 pb-3 gap-2">
                                    <div className="flex items-center gap-2 sm:gap-3 flex-wrap">
                                      <span className={`text-sm font-bold ${isAllDone && !isToday ? 'text-green-700 bg-green-100' : 'text-indigo-700 bg-indigo-50'} px-2.5 py-1 rounded-md`}>Day {dayNum}</span>
                                      <span className="text-sm font-medium text-slate-500">{calculateDate(dayNum)}</span>
                                      
                                      {isToday && (
                                        <span className="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded-md flex items-center gap-1 shadow-sm">
                                          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                          今日進度
                                        </span>
                                      )}
                                    </div>
                                    <div className={`text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap ${isAllDone ? 'text-green-600 bg-green-50' : 'text-slate-500 bg-slate-100'}`}>
                                      {dayCompletedCount} / {dayItems.length}
                                    </div>
                                  </div>

                                  <div className="flex flex-wrap gap-2 mt-1">
                                    {dayItems.map(item => {
                                      const comboId = `${item.initial.symbol}-${item.vowel.symbol}`;
                                      const isCompleted = !!completedItems[comboId];
                                      return (
                                        <button 
                                          key={comboId}
                                          onClick={() => toggleComplete(comboId)}
                                          className={`flex flex-col items-center justify-center px-2.5 py-1.5 rounded-lg border-2 transition-all active:scale-95 ${
                                            isCompleted 
                                              ? 'bg-green-50 border-green-400 shadow-sm' 
                                              : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                                          }`}
                                          title={isCompleted ? "取消完成" : "標記為完成"}
                                        >
                                          <div className="text-base font-bold flex items-center">
                                            <span className="text-blue-600">{item.initial.symbol}</span>
                                            <span className="text-red-600">{item.vowel.symbol}</span>
                                          </div>
                                          <div className="text-[10px] font-medium tracking-wider mt-0.5 flex items-center">
                                            <span className="text-blue-600">{item.initial.letters}</span>
                                            <span className="text-slate-300 mx-0.5"> </span>
                                            <span className="text-red-600">{item.vowel.letters}</span>
                                          </div>
                                        </button>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}

                    {/* 分頁三：隨機練習 */}
                    {activeTab === 'random' && (
                      <div className="flex flex-col items-center justify-center py-8 sm:py-16 space-y-8 animate-fade-in">
                        <div className="bg-amber-50 border border-amber-200 text-amber-800 px-6 py-3 rounded-full font-bold text-lg flex items-center gap-3 shadow-sm text-center">
                          <svg className="w-6 h-6 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                          請練習此組合加 20 個尾子音。
                        </div>

                        {randomCombo ? (
                          <div className="bg-white p-8 sm:p-12 md:p-20 rounded-3xl shadow-lg border border-slate-100 flex flex-col items-center justify-center gap-6 w-full max-w-2xl transform transition-all hover:scale-105 overflow-hidden relative group">
                            {(() => {
                              const comboId = `${randomCombo.initial.symbol}-${randomCombo.vowel.symbol}`;
                              const isStarred = !!starredItems[comboId];
                              return (
                                <button onClick={(e) => toggleStar(e, comboId)} className="absolute top-6 right-6 p-2 rounded-full transition-colors hover:bg-slate-50 focus:outline-none" title="標記為困難音">
                                  <svg className={`w-10 h-10 transition-colors ${isStarred ? 'text-yellow-400 fill-yellow-400' : 'text-slate-300 group-hover:text-yellow-200'}`} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={isStarred ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                </button>
                              );
                            })()}

                            <div className="flex items-center justify-center whitespace-nowrap w-full text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight mt-4">
                              <span className="text-blue-600">{randomCombo.initial.symbol}</span>
                              <span className="text-red-600">{randomCombo.vowel.symbol}</span>
                            </div>
                            <div className="h-px w-24 sm:w-32 bg-slate-100 my-2 sm:my-4"></div>
                            <div className="flex items-center justify-center whitespace-nowrap w-full text-xl sm:text-2xl md:text-3xl font-medium tracking-wider">
                              <span className="text-blue-600">{randomCombo.initial.letters}</span>
                              <span className="text-slate-300 mx-3 sm:mx-6"> </span>
                              <span className="text-red-600">{randomCombo.vowel.letters}</span>
                            </div>
                          </div>
                        ) : (
                          <p className="text-slate-500">目前沒有可用的組合，請先建立練習計劃。</p>
                        )}

                        <button 
                          onClick={generateRandomCombo}
                          className="mt-4 flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-8 py-4 rounded-2xl font-bold text-xl shadow-lg shadow-emerald-500/30 hover:shadow-xl hover:-translate-y-1 active:scale-95 transition-all"
                        >
                          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                          隨機產生下一組
                        </button>
                      </div>
                    )}

                    {/* 分頁四：弱點特訓 */}
                    {activeTab === 'weakness' && (
                      <div className="space-y-6 animate-fade-in">
                        <div className="bg-amber-50 border border-amber-200 p-6 rounded-2xl">
                          <h3 className="text-lg font-bold text-amber-800 flex items-center gap-2 mb-2">
                            <svg className="w-6 h-6 text-amber-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            困難音專屬錯題本
                          </h3>
                          <p className="text-amber-700 font-medium text-sm">這些是您在練習時標記為困難的組合。集中火力反覆練習，各個擊破！</p>
                        </div>

                        {weaknessItems.length === 0 ? (
                          <div className="bg-white p-12 rounded-2xl text-center border border-slate-100 shadow-sm">
                            <svg className="w-16 h-16 text-slate-200 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <p className="text-slate-400 text-lg font-medium">目前沒有收藏的困難音。<br/>在「今日練習」或「隨機練習」點擊右上角的星星即可加入此處。</p>
                          </div>
                        ) : (
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
                            {weaknessItems.map((item, index) => {
                              const comboId = `${item.initial.symbol}-${item.vowel.symbol}`;
                              return (
                                <div key={index} className="bg-white px-2 py-5 sm:px-4 sm:py-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 transition-transform hover:-translate-y-1 hover:shadow-md relative group overflow-hidden">
                                  <button onClick={(e) => toggleStar(e, comboId)} className="absolute top-2 right-2 sm:top-3 sm:right-3 p-1 rounded-full transition-colors hover:bg-slate-50 focus:outline-none" title="取消標記">
                                    <svg className="w-5 h-5 sm:w-6 sm:h-6 text-yellow-400 fill-yellow-400 hover:text-slate-300 hover:fill-none transition-all" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                  </button>
                                  
                                  <div className="flex items-center justify-center whitespace-nowrap w-full text-lg sm:text-xl lg:text-2xl xl:text-lg 2xl:text-xl font-bold tracking-tight mt-2 sm:mt-3">
                                    <span className="text-blue-600">{item.initial.symbol}</span>
                                    <span className="text-red-600">{item.vowel.symbol}</span>
                                  </div>
                                  <div className="h-px w-10 sm:w-12 bg-slate-100 my-0.5 sm:my-1"></div>
                                  <div className="flex items-center justify-center whitespace-nowrap w-full text-xs sm:text-sm font-medium tracking-wider">
                                    <span className="text-blue-600">{item.initial.letters}</span>
                                    <span className="text-slate-300 mx-1.5 sm:mx-2"> </span>
                                    <span className="text-red-600">{item.vowel.letters}</span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}

                    {/* 分頁五：CVC列表 */}
                    {activeTab === 'cvlist' && (
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                          <div className="p-4 bg-blue-50 border-b border-blue-100">
                            <h3 className="font-bold text-blue-800 flex items-center gap-2"><span className="w-2 h-5 bg-blue-500 rounded-full"></span>頭子音項目表 ({INITIALS_DATA.length}組)</h3>
                          </div>
                          <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                            <table className="w-full text-left border-collapse">
                              <thead className="bg-white sticky top-0 shadow-sm z-10"><tr><th className="py-2 px-4 text-xs font-bold text-slate-500">音標</th><th className="py-2 px-4 text-xs font-bold text-slate-500">字母</th><th className="py-2 px-4 text-xs font-bold text-slate-500">所屬組別</th></tr></thead>
                              <tbody className="divide-y divide-slate-50">
                                {INITIALS_DATA.map((item, index) => (
                                  <tr key={index} className="hover:bg-slate-50 transition-colors">
                                    <td className="py-2 px-4 text-lg font-bold text-blue-600">{item.symbol}</td>
                                    <td className="py-2 px-4 text-sm font-medium text-slate-700">{item.letters}</td>
                                    <td className="py-2 px-4"><div className="flex flex-wrap gap-1">{item.tags.map(tag => (<span key={tag} className="text-[10px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md font-bold">{tag}</span>))}</div></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                          <div className="p-4 bg-red-50 border-b border-red-100">
                            <h3 className="font-bold text-red-800 flex items-center gap-2"><span className="w-2 h-5 bg-red-500 rounded-full"></span>母音項目表 ({VOWELS_DATA.length}組)</h3>
                          </div>
                          <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                            <table className="w-full text-left border-collapse">
                              <thead className="bg-white sticky top-0 shadow-sm z-10"><tr><th className="py-2 px-4 text-xs font-bold text-slate-500">音標</th><th className="py-2 px-4 text-xs font-bold text-slate-500">字母</th><th className="py-2 px-4 text-xs font-bold text-slate-500">所屬組別</th></tr></thead>
                              <tbody className="divide-y divide-slate-50">
                                {VOWELS_DATA.map((item, index) => (
                                  <tr key={index} className="hover:bg-slate-50 transition-colors">
                                    <td className="py-2 px-4 text-lg font-bold text-red-600">{item.symbol}</td>
                                    <td className="py-2 px-4 text-sm font-medium text-slate-700">{item.letters}</td>
                                    <td className="py-2 px-4"><div className="flex flex-wrap gap-1">{item.tags.map(tag => (<span key={tag} className="text-[10px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md font-bold">{tag}</span>))}</div></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                          <div className="p-4 bg-emerald-50 border-b border-emerald-100">
                            <h3 className="font-bold text-emerald-800 flex items-center gap-2"><span className="w-2 h-5 bg-emerald-500 rounded-full"></span>尾子音項目表 ({TAILS_DATA.length}組)</h3>
                          </div>
                          <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                            <table className="w-full text-left border-collapse">
                              <thead className="bg-white sticky top-0 shadow-sm z-10"><tr><th className="py-2 px-4 text-xs font-bold text-slate-500">音標</th><th className="py-2 px-4 text-xs font-bold text-slate-500">字母</th><th className="py-2 px-4 text-xs font-bold text-slate-500">屬性</th></tr></thead>
                              <tbody className="divide-y divide-slate-50">
                                {TAILS_DATA.map((item, index) => (
                                  <tr key={index} className="hover:bg-slate-50 transition-colors">
                                    <td className="py-2 px-4 text-lg font-bold text-emerald-600">{item.symbol}</td>
                                    <td className="py-2 px-4 text-sm font-medium text-slate-700">{item.letters}</td>
                                    <td className="py-2 px-4">
                                      <div className="flex flex-wrap gap-1">
                                        {item.tags.length > 0 ? item.tags.map(tag => (
                                          <span key={tag} className="text-[10px] px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-md font-bold">{tag}</span>
                                        )) : <span className="text-[10px] text-slate-400">-</span>}
                                      </div>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>

                      </div>
                    )}

                    {/* 分頁六：設定與備份 */}
                    {activeTab === 'settings' && (
                      <div className="space-y-8 animate-fade-in">
                        
                        <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100">
                          <div className="flex items-center gap-3 mb-6">
                            <div className="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600">
                              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            </div>
                            <div>
                              <h2 className="text-lg font-bold text-slate-800">資料備份與跨裝置轉移</h2>
                              <p className="text-sm text-slate-500">將您的打勾進度與困難音收藏儲存下來，以便在手機或平板上繼續練習。</p>
                            </div>
                          </div>
                          <div className="flex flex-wrap gap-4">
                            <button onClick={handleExportProgress} className="flex-1 sm:flex-none bg-indigo-50 text-indigo-700 px-6 py-3 rounded-xl font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2 border border-indigo-100">
                              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                              匯出進度 (.json)
                            </button>
                            <button onClick={() => fileInputRef.current?.click()} className="flex-1 sm:flex-none bg-emerald-50 text-emerald-700 px-6 py-3 rounded-xl font-bold hover:bg-emerald-100 transition-colors flex items-center justify-center gap-2 border border-emerald-100">
                              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0l-4-4m4 4V4"></path></svg>
                              匯入進度 (.json)
                            </button>
                            <input type="file" accept=".json" ref={fileInputRef} onChange={handleImportProgress} className="hidden" />
                          </div>
                        </div>

                        <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100">
                          <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-6 border-b border-slate-100 pb-6">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                              </div>
                              <div>
                                <h2 className="text-lg font-bold text-slate-800">重新建立每日練習計畫</h2>
                                <p className="text-sm text-slate-500">調整難度與進度，這將會<span className="text-red-500 font-bold">重置</span>您目前的打勾狀態。</p>
                              </div>
                            </div>
                            
                            <div className="grid grid-cols-1 gap-4 w-full xl:w-auto bg-slate-50 p-4 rounded-xl border border-slate-100">
                              <div className="flex items-center justify-between gap-4">
                                <label className="text-sm text-slate-700 font-bold">開始日期</label>
                                <input type="date" value={draftStartDate} onChange={(e) => setDraftStartDate(e.target.value)} className="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" />
                              </div>
                              
                              <div className="flex items-center justify-between gap-4">
                                <label className="text-sm text-slate-700 font-bold">排程方式</label>
                                <div className="flex bg-slate-200/60 p-1 rounded-lg">
                                  <button onClick={() => setDraftPlanMode('itemsPerDay')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${draftPlanMode === 'itemsPerDay' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>每天練幾組</button>
                                  <button onClick={() => setDraftPlanMode('targetDays')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${draftPlanMode === 'targetDays' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>幾天要練完</button>
                                </div>
                              </div>

                              <div className="flex flex-col gap-1 bg-white p-3 rounded-lg border border-slate-200">
                                {draftPlanMode === 'itemsPerDay' ? (
                                  <>
                                    <div className="flex items-center justify-between">
                                      <span className="text-sm text-slate-600 font-medium">每天練</span>
                                      <div className="flex items-center gap-1">
                                        <input type="number" min="1" max="500" value={draftItemsPerDay} onChange={(e) => setDraftItemsPerDay(Number(e.target.value) || 1)} className="w-16 px-2 py-1 bg-slate-50 border border-slate-200 rounded-md text-sm text-center focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                                        <span className="text-sm text-slate-500">組</span>
                                      </div>
                                    </div>
                                    <p className="text-xs text-slate-400 text-right mt-1">系統估算：共需約 <span className="font-bold text-blue-600">{derivedTotalDays}</span> 天練完</p>
                                  </>
                                ) : (
                                  <>
                                    <div className="flex items-center justify-between">
                                      <span className="text-sm text-slate-600 font-medium">目標</span>
                                      <div className="flex items-center gap-1">
                                        <input type="number" min="1" max="500" value={draftTargetDays} onChange={(e) => setDraftTargetDays(Number(e.target.value) || 1)} className="w-16 px-2 py-1 bg-slate-50 border border-slate-200 rounded-md text-sm text-center focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                                        <span className="text-sm text-slate-500">天練完</span>
                                      </div>
                                    </div>
                                    <p className="text-xs text-slate-400 text-right mt-1">系統估算：每天需練 <span className="font-bold text-blue-600">{derivedItemsPerDay}</span> 組</p>
                                  </>
                                )}
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                              <h3 className="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="w-2 h-6 bg-blue-500 rounded-full"></span>
                                頭子音選項
                                <span className="text-xs font-normal text-slate-400 ml-auto">已選 {INITIALS_DATA.filter(i => i.tags.some(t => draftInitialFilters.includes(t))).length} 個音</span>
                              </h3>
                              <div className="grid grid-cols-2 gap-3">
                                {INITIAL_GROUPS.map(group => (
                                  <label key={group} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all ${draftInitialFilters.includes(group) ? 'bg-blue-50 border-blue-200' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                    <input type="checkbox" checked={draftInitialFilters.includes(group)} onChange={() => handleInitialFilterChange(group)} className="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                    <span className={`text-sm font-medium ${draftInitialFilters.includes(group) ? 'text-blue-800' : 'text-slate-600'}`}>{group}</span>
                                  </label>
                                ))}
                              </div>
                            </div>

                            <div>
                              <h3 className="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="w-2 h-6 bg-red-500 rounded-full"></span>
                                母音選項
                                <span className="text-xs font-normal text-slate-400 ml-auto">已選 {VOWELS_DATA.filter(v => v.tags.some(t => draftVowelFilters.includes(t))).length} 個音</span>
                              </h3>
                              <div className="grid grid-cols-2 gap-3">
                                {VOWEL_GROUPS.map(group => (
                                  <label key={group} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all ${draftVowelFilters.includes(group) ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                    <input type="checkbox" checked={draftVowelFilters.includes(group)} onChange={() => handleVowelFilterChange(group)} className="w-4 h-4 text-red-600 rounded border-slate-300 focus:ring-red-500" />
                                    <span className={`text-sm font-medium ${draftVowelFilters.includes(group) ? 'text-red-800' : 'text-slate-600'}`}>{group}</span>
                                  </label>
                                ))}
                              </div>
                            </div>
                          </div>

                          <div className="flex justify-center mt-10 pt-6 border-t border-slate-100">
                            <button 
                              onClick={() => setShowConfirmModal(true)}
                              className="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/30 hover:shadow-xl hover:-translate-y-1 transition-all"
                            >
                              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                              重置並建立每日練習計劃
                            </button>
                          </div>
                        </div>

                      </div>
                    )}
                  </>
                )}
              </div>

              {toastMessage && (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3 animate-fade-in-up z-50">
                  <svg className="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                  <span className="text-sm font-medium">{toastMessage}</span>
                </div>
              )}

              {showConfirmModal && (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-scale-in">
                    <div className="bg-red-50 p-6 text-center">
                      <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                      </div>
                      <h3 className="text-xl font-bold text-red-800 mb-2">確認建立新計劃？</h3>
                      <p className="text-red-600 font-medium">注意！按下後，原來的練習計劃（包含所有打勾進度）將被徹底重置！</p>
                      <p className="text-red-700 font-bold mt-2 bg-red-100/50 py-1.5 px-3 rounded-lg border border-red-200/50">請記得先匯出進度做備份。</p>
                    </div>
                    <div className="p-6 bg-white flex gap-3">
                      <button 
                        onClick={() => setShowConfirmModal(false)}
                        className="flex-1 py-3 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors"
                      >
                        取消
                      </button>
                      <button 
                        onClick={handleCreatePlan}
                        className="flex-1 py-3 px-4 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-colors shadow-lg shadow-red-600/20"
                      >
                        確定重置與建立
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
